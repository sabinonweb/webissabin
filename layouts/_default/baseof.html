<!DOCTYPE html>
<html lang="en">
<head>
  <title>
      {{if .IsHome}} 
        {{.Site.Title}}
      {{else}}
        {{.Title}} - {{.Site.Title}}
      {{end}}
    </title> 

  {{ $css := resources.Get "css/main.css" | minify | fingerprint }}
  <link rel="stylesheet" href="{{ $css.RelPermalink }}">
</head>
<body>
  <div class="wrap">

      {{ partial "header.html" .}}

    <main>
        {{block "main" . }} {{end}}    <!-- ⬅ THE HOLE -->
    </main>

      {{partial "footer.html" .}}
    </div>

 
</body>
</html>
