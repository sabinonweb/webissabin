{{ define "main" }}
<h1 class="page-title">{{ .Title }}</h1>

<ul class="post-list">
  {{ range .Pages }}
    <li class="post-card">
      <a class="post-title" href="{{ .RelPermalink }}">{{ .Title }}</a>
        <span class="post-date">{{ .Date.Format "Jan 2, 2006" }}</span>
        {{ with .Description }}<p class="post-desc">{{ . }}</p>{{ end }}  
    </li>
    {{end}}
</ul>
{{end}}
