<script>
(function () {
  // Placeholder password is "changeme" — replace PASSWORD_HASH below with your own.
  // Generate your own hash in any browser console:
  //   crypto.subtle.digest('SHA-256', new TextEncoder().encode('yourpassword'))
  //     .then(buf => console.log(Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('')))
  var PASSWORD_HASH = "057ba03d6c44104863dc7361fe4578965d1887360f90a0895882e58a6248fc86";

  var gate = document.getElementById("gate");
  var content = document.getElementById("content");
  var input = document.getElementById("gate-input");
  var submit = document.getElementById("gate-submit");
  var error = document.getElementById("gate-error");

  function unlock() {
    gate.style.display = "none";
    content.style.display = "";
  }

  function sha256Hex(text) {
    return crypto.subtle.digest("SHA-256", new TextEncoder().encode(text)).then(function (buf) {
      return Array.from(new Uint8Array(buf)).map(function (b) {
        return b.toString(16).padStart(2, "0");
      }).join("");
    });
  }

  function tryUnlock() {
    sha256Hex(input.value).then(function (hash) {
      if (hash === PASSWORD_HASH) {
        unlock();
      } else {
        error.textContent = "Wrong password.";
      }
    });
  }

  submit.addEventListener("click", tryUnlock);
  input.addEventListener("keydown", function (e) {
    if (e.key === "Enter") tryUnlock();
  });
})();
</script>
