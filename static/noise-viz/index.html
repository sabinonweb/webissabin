<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Noise XX Handshake</title>
<style>
  :root {
    --bg: #f5f4f0;
    --surface: #ffffff;
    --border: #ddd8cf;
    --text: #1a1a18;
    --text-dim: #726f66;
    --alice: #0f766e;
    --alice-soft: #0f766e1a;
    --bob: #b45309;
    --bob-soft: #b453091a;
    --secret: #6d28d9;
    --secret-soft: #6d28d91a;
    --mono-bg: #ece8dd;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #14161a;
      --surface: #1b1e24;
      --border: #2c303a;
      --text: #e9e7e1;
      --text-dim: #9a988f;
      --alice: #2dd4bf;
      --alice-soft: #2dd4bf22;
      --bob: #f5a524;
      --bob-soft: #f5a52422;
      --secret: #a78bfa;
      --secret-soft: #a78bfa22;
      --mono-bg: #23272f;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #14161a;
    --surface: #1b1e24;
    --border: #2c303a;
    --text: #e9e7e1;
    --text-dim: #9a988f;
    --alice: #2dd4bf;
    --alice-soft: #2dd4bf22;
    --bob: #f5a524;
    --bob-soft: #f5a52422;
    --secret: #a78bfa;
    --secret-soft: #a78bfa22;
    --mono-bg: #23272f;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html, body { background: var(--bg); }
  body {
    margin: 0;
    color: var(--text);
    font-family: "IBM Plex Sans", system-ui, sans-serif;
    padding: 32px 16px 48px;
    display: flex;
    justify-content: center;
  }
  .page { width: 100%; max-width: 760px; }

  header { margin-bottom: 18px; }
  h1 {
    font-family: "Fraunces", Georgia, serif;
    font-size: clamp(1.5rem, 4vw, 2rem);
    font-weight: 600;
    margin: 0 0 6px;
    text-wrap: balance;
  }
  .subtitle { color: var(--text-dim); font-size: 0.92rem; margin: 0; }

  .legend {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin: 16px 0 20px;
  }
  .legend span {
    font-family: "IBM Plex Mono", monospace;
    font-size: 0.72rem;
    background: var(--mono-bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 3px 8px;
    color: var(--text-dim);
  }
  .legend b { color: var(--text); font-weight: 600; }

  .progress {
    font-family: "IBM Plex Mono", monospace;
    font-size: 0.72rem;
    color: var(--text-dim);
    margin-bottom: 8px;
  }

  .caption {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
    font-size: 0.95rem;
    line-height: 1.55;
    margin-bottom: 18px;
    min-height: 4.4em;
  }
  .caption b { color: var(--text); }
  .caption code {
    font-family: "IBM Plex Mono", monospace;
    font-size: 0.85em;
    background: var(--mono-bg);
    border-radius: 4px;
    padding: 1px 5px;
    color: var(--secret);
  }

  .stage {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    gap: 10px;
    align-items: start;
  }
  @media (max-width: 560px) {
    .stage { grid-template-columns: 1fr; }
    .arrowcol { order: 2; }
    .actor.bob { order: 3; }
    .actor.alice { order: 1; }
  }

  .actor {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px;
    min-height: 280px;
    transition: border-color 0.25s ease, box-shadow 0.25s ease;
  }
  .actor.active.alice { border-color: var(--alice); box-shadow: 0 0 0 1px var(--alice); }
  .actor.active.bob { border-color: var(--bob); box-shadow: 0 0 0 1px var(--bob); }
  .actor h2 {
    margin: 0 0 10px;
    font-size: 1rem;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
  .alice .dot { background: var(--alice); }
  .bob .dot { background: var(--bob); }

  .item {
    font-family: "IBM Plex Mono", monospace;
    font-size: 0.74rem;
    line-height: 1.35;
    border-radius: 7px;
    padding: 6px 8px;
    margin-bottom: 6px;
    opacity: 0;
    transform: translateY(4px);
    transition: opacity 0.35s ease, transform 0.35s ease;
    border-left: 3px solid transparent;
  }
  .item.show { opacity: 1; transform: translateY(0); }
  .actor.alice .item.show.own,
  .actor.alice .item.show.peer { background: var(--alice-soft); }
  .actor.bob .item.show.own,
  .actor.bob .item.show.peer { background: var(--bob-soft); }
  .item.show.secret { background: var(--secret-soft); color: var(--secret); font-weight: 600; }
  .item.show.priv { background: transparent; border: 1px dashed var(--border); opacity: 0.7; color: var(--text-dim); }
  .item.secret::before { content: "\1F511  "; }
  .item.priv::before { content: "\1F512  "; }
  .actor.alice .item.show.peer { border-left-color: var(--bob); }
  .actor.bob .item.show.peer { border-left-color: var(--alice); }

  .arrowcol {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 220px;
    padding: 0 4px;
  }
  .msg {
    text-align: center;
    font-family: "IBM Plex Mono", monospace;
    font-size: 0.68rem;
    color: var(--text-dim);
    opacity: 0;
    transition: opacity 0.35s ease;
  }
  .msg.show { opacity: 1; }
  .msg .dir { font-size: 1.3rem; margin: 4px 0; color: var(--text); }
  .msg .tag { color: var(--secret); font-weight: 600; }

  .controls {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-top: 20px;
  }
  .steps {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 5px;
    max-width: 55%;
  }
  .steps button {
    width: 9px; height: 9px; border-radius: 50%;
    border: 1px solid var(--border);
    background: var(--mono-bg);
    padding: 0; cursor: pointer;
    flex: none;
  }
  .steps button.active { background: var(--secret); border-color: var(--secret); }

  .navbtn {
    font-family: "IBM Plex Sans", sans-serif;
    font-size: 0.85rem;
    font-weight: 600;
    padding: 8px 16px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
  }
  .navbtn:disabled { opacity: 0.4; cursor: default; }
  .navbtn.primary { background: var(--text); color: var(--bg); border-color: var(--text); }
</style>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600&family=IBM+Plex+Sans:wght@400;600&family=IBM+Plex+Mono:wght@400;600&display=swap">
</head>
<body>
<div class="page">
  <header>
    <h1>Noise XX Handshake</h1>
    <p class="subtitle">Every private key, public key, and encryption step — one operation at a time.</p>
  </header>

  <div class="legend">
    <span>🔒 <b>private key</b> — generated, kept, never transmitted</span>
    <span>plain item — <b>public key</b>, travels on the wire</span>
    <span>🔑 <b>derived secret</b> — from a DH operation</span>
  </div>

  <div class="progress" id="progress"></div>
  <div class="caption" id="caption"></div>

  <div class="stage">
    <div class="actor alice" id="alice-card">
      <h2><span class="dot"></span>Alice (initiator)</h2>
      <div id="alice-items"></div>
    </div>
    <div class="arrowcol">
      <div class="msg" id="msg"></div>
    </div>
    <div class="actor bob" id="bob-card">
      <h2><span class="dot"></span>Bob (responder)</h2>
      <div id="bob-items"></div>
    </div>
  </div>

  <div class="controls">
    <button class="navbtn" id="prev">Prev</button>
    <div class="steps" id="dots"></div>
    <button class="navbtn primary" id="next">Next</button>
  </div>
</div>

<script>
(function(){
  var steps = [
    {
      active: null, msg: null,
      caption: "Both peers already hold a long-term <b>static identity keypair</b> — generated once, long before this handshake, and reused across every future connection.",
      alice: [
        { label: "Static private key", tag: "priv" },
        { label: "Static public key", tag: "own" }
      ],
      bob: [
        { label: "Static private key", tag: "priv" },
        { label: "Static public key", tag: "own" }
      ]
    },
    {
      active: "alice", msg: null,
      caption: "Alice generates a fresh, one-time <b>ephemeral keypair</b>. <code>e_priv_a</code> stays on her machine forever — only the public half is meant to travel.",
      alice: [
        { label: "Static private key", tag: "priv" },
        { label: "Static public key", tag: "own" },
        { label: "Ephemeral private key (e_priv_a)", tag: "priv" },
        { label: "Ephemeral public key (e_pub_a) — about to send", tag: "own" }
      ],
      bob: [
        { label: "Static private key", tag: "priv" },
        { label: "Static public key", tag: "own" }
      ]
    },
    {
      active: null, msg: { arrow: "→", tag: "e_pub_a  (plaintext)" },
      caption: "<b>Message 1.</b> Alice sends <code>e_pub_a</code> in the clear — there's no shared secret yet to encrypt anything with.",
      alice: [
        { label: "Static private key", tag: "priv" },
        { label: "Static public key", tag: "own" },
        { label: "Ephemeral private key (e_priv_a)", tag: "priv" },
        { label: "Ephemeral public key (e_pub_a) — sent", tag: "own" }
      ],
      bob: [
        { label: "Static private key", tag: "priv" },
        { label: "Static public key", tag: "own" },
        { label: "Alice's ephemeral pub (e_pub_a) — received", tag: "peer" }
      ]
    },
    {
      active: "bob", msg: null,
      caption: "Bob generates his own <b>ephemeral keypair</b>. Same rule: <code>e_priv_b</code> never leaves.",
      alice: null,
      bob: [
        { label: "Static private key", tag: "priv" },
        { label: "Static public key", tag: "own" },
        { label: "Alice's ephemeral pub (e_pub_a) — received", tag: "peer" },
        { label: "Ephemeral private key (e_priv_b)", tag: "priv" },
        { label: "Ephemeral public key (e_pub_b) — about to send", tag: "own" }
      ]
    },
    {
      active: "bob", msg: null,
      caption: "Bob computes <code>ee = DH(e_priv_b, e_pub_a)</code>. This is the first shared secret — call the key derived from it <code>k1</code>. Alice will get the identical value from her own side.",
      alice: null,
      bob: [
        { label: "Static private key", tag: "priv" },
        { label: "Static public key", tag: "own" },
        { label: "Alice's ephemeral pub (e_pub_a) — received", tag: "peer" },
        { label: "Ephemeral private key (e_priv_b)", tag: "priv" },
        { label: "Ephemeral public key (e_pub_b) — about to send", tag: "own" },
        { label: "ee = DH(e_priv_b, e_pub_a)  → k1", tag: "secret" }
      ]
    },
    {
      active: "bob", msg: null,
      caption: "Bob encrypts his own <b>static public key</b> using <code>k1</code>, so his identity never appears in plaintext on the wire.",
      alice: null,
      bob: [
        { label: "Static private key", tag: "priv" },
        { label: "Static public key (encrypting w/ k1, about to send)", tag: "own" },
        { label: "Alice's ephemeral pub (e_pub_a) — received", tag: "peer" },
        { label: "Ephemeral private key (e_priv_b)", tag: "priv" },
        { label: "Ephemeral public key (e_pub_b) — about to send", tag: "own" },
        { label: "ee = DH(e_priv_b, e_pub_a)  → k1", tag: "secret" }
      ]
    },
    {
      active: "bob", msg: null,
      caption: "Bob computes <code>es = DH(s_priv_b, e_pub_a)</code> and mixes it in: <code>k2 = KDF(k1, es)</code>.",
      alice: null,
      bob: [
        { label: "Static private key", tag: "priv" },
        { label: "Static public key (encrypted w/ k1, about to send)", tag: "own" },
        { label: "Alice's ephemeral pub (e_pub_a) — received", tag: "peer" },
        { label: "Ephemeral private key (e_priv_b)", tag: "priv" },
        { label: "Ephemeral public key (e_pub_b) — about to send", tag: "own" },
        { label: "ee = DH(e_priv_b, e_pub_a)  → k1", tag: "secret" },
        { label: "es = DH(s_priv_b, e_pub_a)  → k2", tag: "secret" }
      ]
    },
    {
      active: null, msg: { arrow: "←", tag: "e_pub_b  +  s_pub_b encrypted w/ k1" },
      caption: "<b>Message 2.</b> Bob sends his ephemeral public key (plaintext) plus his encrypted static key. Alice computes <code>ee</code> and <code>es</code> herself — same values, by DH symmetry — decrypts Bob's identity with k1, and now also holds k2.",
      alice: [
        { label: "Static private key", tag: "priv" },
        { label: "Static public key", tag: "own" },
        { label: "Ephemeral private key (e_priv_a)", tag: "priv" },
        { label: "Ephemeral public key (e_pub_a) — sent", tag: "own" },
        { label: "Bob's ephemeral pub (e_pub_b) — received", tag: "peer" },
        { label: "ee = DH(e_priv_a, e_pub_b)  → k1", tag: "secret" },
        { label: "Bob's static pub — decrypted w/ k1", tag: "peer" },
        { label: "es = DH(e_priv_a, s_pub_b)  → k2", tag: "secret" }
      ],
      bob: [
        { label: "Static private key", tag: "priv" },
        { label: "Static public key — sent, encrypted w/ k1", tag: "own" },
        { label: "Alice's ephemeral pub (e_pub_a) — received", tag: "peer" },
        { label: "Ephemeral private key (e_priv_b)", tag: "priv" },
        { label: "Ephemeral public key (e_pub_b) — sent", tag: "own" },
        { label: "ee = DH(e_priv_b, e_pub_a)  → k1", tag: "secret" },
        { label: "es = DH(s_priv_b, e_pub_a)  → k2", tag: "secret" }
      ]
    },
    {
      active: "alice", msg: null,
      caption: "Alice encrypts her own <b>static public key</b> using <code>k2</code> (built from ee + es).",
      alice: [
        { label: "Static private key", tag: "priv" },
        { label: "Static public key (encrypting w/ k2, about to send)", tag: "own" },
        { label: "Ephemeral private key (e_priv_a)", tag: "priv" },
        { label: "Ephemeral public key (e_pub_a) — sent", tag: "own" },
        { label: "Bob's ephemeral pub (e_pub_b) — received", tag: "peer" },
        { label: "ee = DH(e_priv_a, e_pub_b)  → k1", tag: "secret" },
        { label: "Bob's static pub — decrypted w/ k1", tag: "peer" },
        { label: "es = DH(e_priv_a, s_pub_b)  → k2", tag: "secret" }
      ],
      bob: null
    },
    {
      active: "alice", msg: null,
      caption: "Alice computes <code>se = DH(s_priv_a, e_pub_b)</code> and mixes it in: <code>k3 = KDF(k2, se)</code> — this becomes the session key.",
      alice: [
        { label: "Static private key", tag: "priv" },
        { label: "Static public key (encrypted w/ k2, about to send)", tag: "own" },
        { label: "Ephemeral private key (e_priv_a)", tag: "priv" },
        { label: "Ephemeral public key (e_pub_a) — sent", tag: "own" },
        { label: "Bob's ephemeral pub (e_pub_b) — received", tag: "peer" },
        { label: "ee = DH(e_priv_a, e_pub_b)  → k1", tag: "secret" },
        { label: "Bob's static pub — decrypted w/ k1", tag: "peer" },
        { label: "es = DH(e_priv_a, s_pub_b)  → k2", tag: "secret" },
        { label: "se = DH(s_priv_a, e_pub_b)  → k3 (session key)", tag: "secret" }
      ],
      bob: null
    },
    {
      active: null, msg: { arrow: "→", tag: "s_pub_a encrypted w/ k2" },
      caption: "<b>Message 3.</b> Alice sends her encrypted static key. Bob decrypts it with the k2 he already holds, then computes <code>se = DH(e_priv_b, s_pub_a)</code> himself — the identical k3.",
      alice: [
        { label: "Static private key", tag: "priv" },
        { label: "Static public key — sent, encrypted w/ k2", tag: "own" },
        { label: "Ephemeral private key (e_priv_a)", tag: "priv" },
        { label: "Ephemeral public key (e_pub_a) — sent", tag: "own" },
        { label: "Bob's ephemeral pub (e_pub_b) — received", tag: "peer" },
        { label: "ee = DH(e_priv_a, e_pub_b)  → k1", tag: "secret" },
        { label: "Bob's static pub — decrypted w/ k1", tag: "peer" },
        { label: "es = DH(e_priv_a, s_pub_b)  → k2", tag: "secret" },
        { label: "se = DH(s_priv_a, e_pub_b)  → k3 (session key)", tag: "secret" }
      ],
      bob: [
        { label: "Static private key", tag: "priv" },
        { label: "Static public key — sent, encrypted w/ k1", tag: "own" },
        { label: "Alice's ephemeral pub (e_pub_a) — received", tag: "peer" },
        { label: "Ephemeral private key (e_priv_b)", tag: "priv" },
        { label: "Ephemeral public key (e_pub_b) — sent", tag: "own" },
        { label: "ee = DH(e_priv_b, e_pub_a)  → k1", tag: "secret" },
        { label: "es = DH(s_priv_b, e_pub_a)  → k2", tag: "secret" },
        { label: "Alice's static pub — decrypted w/ k2", tag: "peer" },
        { label: "se = DH(e_priv_b, s_pub_a)  → k3 (session key)", tag: "secret" }
      ]
    },
    {
      active: null, msg: { arrow: "↔", tag: "session established ✓" },
      caption: "Both sides now hold the identical <code>k3</code>. Because <code>es</code> and <code>se</code> each required a real static private key, this session key is cryptographically bound to <b>both</b> identities — not just \"someone answered.\"",
      alice: null,
      bob: null
    }
  ];

  // fill forward any step with alice/bob left as null (no change from previous step)
  for (var i = 1; i < steps.length; i++) {
    if (steps[i].alice === null) steps[i].alice = steps[i-1].alice;
    if (steps[i].bob === null) steps[i].bob = steps[i-1].bob;
  }
  steps[steps.length-1].alice = steps[steps.length-1].alice.concat([{ label: "Session key k3 ✓", tag: "secret" }]);
  steps[steps.length-1].bob = steps[steps.length-1].bob.concat([{ label: "Session key k3 ✓", tag: "secret" }]);

  var current = 0;
  var aliceEl = document.getElementById("alice-items");
  var bobEl = document.getElementById("bob-items");
  var msgEl = document.getElementById("msg");
  var capEl = document.getElementById("caption");
  var progEl = document.getElementById("progress");
  var dotsEl = document.getElementById("dots");
  var prevBtn = document.getElementById("prev");
  var nextBtn = document.getElementById("next");
  var aliceCard = document.getElementById("alice-card");
  var bobCard = document.getElementById("bob-card");

  function renderActor(container, items) {
    container.innerHTML = "";
    items.forEach(function(it) {
      var div = document.createElement("div");
      div.className = "item show " + it.tag;
      div.textContent = it.label;
      container.appendChild(div);
    });
  }

  function renderDots() {
    dotsEl.innerHTML = "";
    steps.forEach(function(_, i) {
      var b = document.createElement("button");
      b.className = i === current ? "active" : "";
      b.addEventListener("click", function(){ current = i; render(); });
      dotsEl.appendChild(b);
    });
  }

  function render() {
    var s = steps[current];
    progEl.textContent = "Step " + (current + 1) + " of " + steps.length;
    capEl.innerHTML = s.caption;
    renderActor(aliceEl, s.alice);
    renderActor(bobEl, s.bob);
    aliceCard.classList.toggle("active", s.active === "alice");
    bobCard.classList.toggle("active", s.active === "bob");
    if (s.msg) {
      msgEl.innerHTML = "<div class='dir'>" + s.msg.arrow + "</div><div class='tag'>" + s.msg.tag + "</div>";
      msgEl.classList.add("show");
    } else {
      msgEl.innerHTML = "";
      msgEl.classList.remove("show");
    }
    prevBtn.disabled = current === 0;
    nextBtn.disabled = current === steps.length - 1;
    nextBtn.textContent = current === steps.length - 1 ? "Done" : "Next";
    renderDots();
  }

  prevBtn.addEventListener("click", function(){ if (current > 0) { current--; render(); } });
  nextBtn.addEventListener("click", function(){ if (current < steps.length - 1) { current++; render(); } });

  render();
})();
</script>
</body>
</html>
