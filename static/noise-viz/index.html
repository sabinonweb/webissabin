<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Noise XX Handshake</title>
<style>
  :root {
    --bg: #f5f4f0;
    --surface: #ffffff;
    --border: #ddd8cf;
    --text: #1a1a18;
    --text-dim: #726f66;
    --alice: #0f766e;
    --alice-soft: #0f766e1a;
    --bob: #b45309;
    --bob-soft: #b453091a;
    --secret: #6d28d9;
    --secret-soft: #6d28d91a;
    --mono-bg: #ece8dd;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #14161a;
      --surface: #1b1e24;
      --border: #2c303a;
      --text: #e9e7e1;
      --text-dim: #9a988f;
      --alice: #2dd4bf;
      --alice-soft: #2dd4bf22;
      --bob: #f5a524;
      --bob-soft: #f5a52422;
      --secret: #a78bfa;
      --secret-soft: #a78bfa22;
      --mono-bg: #23272f;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #14161a;
    --surface: #1b1e24;
    --border: #2c303a;
    --text: #e9e7e1;
    --text-dim: #9a988f;
    --alice: #2dd4bf;
    --alice-soft: #2dd4bf22;
    --bob: #f5a524;
    --bob-soft: #f5a52422;
    --secret: #a78bfa;
    --secret-soft: #a78bfa22;
    --mono-bg: #23272f;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html, body { background: var(--bg); }
  body {
    margin: 0;
    color: var(--text);
    font-family: "IBM Plex Sans", system-ui, sans-serif;
    padding: 32px 16px 48px;
    display: flex;
    justify-content: center;
  }
  .page { width: 100%; max-width: 720px; }

  header { margin-bottom: 20px; }
  h1 {
    font-family: "Fraunces", Georgia, serif;
    font-size: clamp(1.5rem, 4vw, 2rem);
    font-weight: 600;
    margin: 0 0 6px;
    text-wrap: balance;
  }
  .subtitle { color: var(--text-dim); font-size: 0.92rem; margin: 0; }

  .legend {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin: 16px 0 24px;
  }
  .legend span {
    font-family: "IBM Plex Mono", monospace;
    font-size: 0.75rem;
    background: var(--mono-bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 3px 8px;
    color: var(--text-dim);
  }
  .legend b { color: var(--text); font-weight: 600; }

  .caption {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
    font-size: 0.95rem;
    line-height: 1.5;
    margin-bottom: 18px;
    min-height: 3.2em;
  }
  .caption b { color: var(--text); }

  .stage {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    gap: 10px;
    align-items: start;
  }
  @media (max-width: 560px) {
    .stage { grid-template-columns: 1fr; }
    .arrowcol { order: 2; }
    .actor.bob { order: 3; }
    .actor.alice { order: 1; }
  }

  .actor {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px;
    min-height: 220px;
  }
  .actor h2 {
    margin: 0 0 10px;
    font-size: 1rem;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
  .alice .dot { background: var(--alice); }
  .bob .dot { background: var(--bob); }

  .item {
    font-family: "IBM Plex Mono", monospace;
    font-size: 0.78rem;
    border-radius: 7px;
    padding: 6px 8px;
    margin-bottom: 6px;
    opacity: 0;
    transform: translateY(4px);
    transition: opacity 0.35s ease, transform 0.35s ease;
    display: flex;
    justify-content: space-between;
    gap: 6px;
  }
  .item.show { opacity: 1; transform: translateY(0); }
  .item .k { color: var(--text-dim); }
  .actor.alice .item.show { background: var(--alice-soft); }
  .actor.bob .item.show { background: var(--bob-soft); }
  .item.secret.show { background: var(--secret-soft); }
  .item.secret .k { color: var(--secret); font-weight: 600; }

  .arrowcol {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 220px;
    padding: 0 4px;
  }
  .msg {
    text-align: center;
    font-family: "IBM Plex Mono", monospace;
    font-size: 0.72rem;
    color: var(--text-dim);
    opacity: 0;
    transition: opacity 0.35s ease;
  }
  .msg.show { opacity: 1; }
  .msg .dir { font-size: 1.3rem; margin: 4px 0; color: var(--text); }
  .msg .tag { color: var(--secret); font-weight: 600; }

  .controls {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-top: 22px;
  }
  .steps {
    display: flex;
    gap: 6px;
  }
  .steps button {
    width: 10px; height: 10px; border-radius: 50%;
    border: 1px solid var(--border);
    background: var(--mono-bg);
    padding: 0; cursor: pointer;
  }
  .steps button.active { background: var(--secret); border-color: var(--secret); }

  .navbtn {
    font-family: "IBM Plex Sans", sans-serif;
    font-size: 0.85rem;
    font-weight: 600;
    padding: 8px 16px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
  }
  .navbtn:disabled { opacity: 0.4; cursor: default; }
  .navbtn.primary { background: var(--text); color: var(--bg); border-color: var(--text); }
</style>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600&family=IBM+Plex+Sans:wght@400;600&family=IBM+Plex+Mono:wght@400;600&display=swap">
</head>
<body>
<div class="page">
  <header>
    <h1>Noise XX Handshake</h1>
    <p class="subtitle">Two strangers, no prior knowledge of each other's identity key — step through the 3 messages.</p>
  </header>

  <div class="legend">
    <span><b>e</b> = ephemeral key</span>
    <span><b>s</b> = static (identity) key</span>
    <span><b>ee/es/se</b> = a Diffie-Hellman between those two key types</span>
  </div>

  <div class="caption" id="caption"></div>

  <div class="stage">
    <div class="actor alice">
      <h2><span class="dot"></span>Alice (initiator)</h2>
      <div id="alice-items"></div>
    </div>
    <div class="arrowcol">
      <div class="msg" id="msg"></div>
    </div>
    <div class="actor bob">
      <h2><span class="dot"></span>Bob (responder)</h2>
      <div id="bob-items"></div>
    </div>
  </div>

  <div class="controls">
    <button class="navbtn" id="prev">Prev</button>
    <div class="steps" id="dots"></div>
    <button class="navbtn primary" id="next">Next</button>
  </div>
</div>

<script>
(function(){
  var steps = [
    {
      caption: "<b>Before message 1.</b> Each side already owns a long-term static keypair (their mesh identity). Neither has generated an ephemeral key yet, and neither knows anything about the other.",
      msg: null,
      alice: ["static"],
      bob: ["static"]
    },
    {
      caption: "<b>Message 1 — Alice → Bob.</b> Alice generates a fresh ephemeral keypair and sends the public half in plaintext. Nothing is computed yet.",
      msg: { arrow: "→", label: "Alice → Bob", tag: "e" },
      alice: ["static", "eph-own"],
      bob: ["static", "eph-alice"]
    },
    {
      caption: "<b>Message 2 — Bob → Alice.</b> Bob generates his own ephemeral key and computes <span class='tag' style='color:var(--secret)'>ee</span>. That secret lets him encrypt his static key before sending it, and he also computes <span style='color:var(--secret)'>es</span> using his static key. Alice receives both, computes ee and es herself, and decrypts Bob's identity.",
      msg: { arrow: "←", label: "Bob → Alice", tag: "e, ee, s(enc), es" },
      alice: ["static", "eph-own", "eph-bob", "static-bob", "ee", "es"],
      bob: ["static", "eph-alice", "eph-own", "ee", "es"]
    },
    {
      caption: "<b>Message 3 — Alice → Bob.</b> Alice sends her own static key, encrypted, and computes <span style='color:var(--secret)'>se</span> using it. Bob decrypts it and computes se himself. Both sides have now run ee, es, se.",
      msg: { arrow: "→", label: "Alice → Bob", tag: "s(enc), se" },
      alice: ["static", "eph-own", "eph-bob", "static-bob", "ee", "es", "se"],
      bob: ["static", "eph-alice", "eph-own", "static-alice", "ee", "es", "se"]
    },
    {
      caption: "<b>Session established.</b> ee, es, and se are all mixed together into one final key. Because es and se each required a real static private key, both identities are now cryptographically bound to this session — not just \"someone answered.\"",
      msg: { arrow: "↔", label: "Alice ↔ Bob", tag: "session key ✓" },
      alice: ["static", "eph-own", "eph-bob", "static-bob", "ee", "es", "se", "session"],
      bob: ["static", "eph-alice", "eph-own", "static-alice", "ee", "es", "se", "session"]
    }
  ];

  var itemDefs = {
    "static":       { label: "Own static key", who: "own" },
    "eph-own":      { label: "Own ephemeral key", who: "own" },
    "eph-alice":    { label: "Alice's ephemeral (recv'd)", who: "peer" },
    "eph-bob":      { label: "Bob's ephemeral (recv'd)", who: "peer" },
    "static-alice": { label: "Alice's static (decrypted)", who: "peer" },
    "static-bob":   { label: "Bob's static (decrypted)", who: "peer" },
    "ee":           { label: "ee shared secret", who: "secret" },
    "es":           { label: "es shared secret", who: "secret" },
    "se":           { label: "se shared secret", who: "secret" },
    "session":      { label: "Session key", who: "secret" }
  };

  var current = 0;
  var aliceEl = document.getElementById("alice-items");
  var bobEl = document.getElementById("bob-items");
  var msgEl = document.getElementById("msg");
  var capEl = document.getElementById("caption");
  var dotsEl = document.getElementById("dots");
  var prevBtn = document.getElementById("prev");
  var nextBtn = document.getElementById("next");

  function renderActor(container, keys) {
    container.innerHTML = "";
    keys.forEach(function(key) {
      var def = itemDefs[key];
      var div = document.createElement("div");
      div.className = "item show" + (def.who === "secret" ? " secret" : "");
      div.innerHTML = "<span class='k'>" + def.label + "</span>";
      container.appendChild(div);
    });
  }

  function renderDots() {
    dotsEl.innerHTML = "";
    steps.forEach(function(_, i) {
      var b = document.createElement("button");
      b.className = i === current ? "active" : "";
      b.addEventListener("click", function(){ current = i; render(); });
      dotsEl.appendChild(b);
    });
  }

  function render() {
    var s = steps[current];
    capEl.innerHTML = s.caption;
    renderActor(aliceEl, s.alice);
    renderActor(bobEl, s.bob);
    if (s.msg) {
      msgEl.innerHTML = "<div class='dir'>" + s.msg.arrow + "</div><div class='tag'>" + s.msg.tag + "</div>";
      msgEl.classList.add("show");
    } else {
      msgEl.innerHTML = "";
      msgEl.classList.remove("show");
    }
    prevBtn.disabled = current === 0;
    nextBtn.disabled = current === steps.length - 1;
    nextBtn.textContent = current === steps.length - 1 ? "Done" : "Next";
    renderDots();
  }

  prevBtn.addEventListener("click", function(){ if (current > 0) { current--; render(); } });
  nextBtn.addEventListener("click", function(){ if (current < steps.length - 1) { current++; render(); } });

  render();
})();
</script>
</body>
</html>
